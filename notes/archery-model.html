<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从走跑平衡到乒乓球发力 · Ant</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="site-header"><a class="brand" href="../">ANT<span>/NOTES</span></a><nav><a href="../#notes">笔记</a><a href="../#about">关于</a></nav></header><main><article class="hero"><p class="eyebrow">01 / 发力模型</p><h1>从走跑平衡到<br><em>乒乓球发力</em></h1><p class="intro">弓箭不是比喻，而是一种观察身体协作的工具：脚下建立支撑，躯干储存方向，前臂和手腕完成释放。</p><div class="section-block" style="padding-top:64px"><h2>先有方向，再有速度</h2><p class="intro">训练中最容易被忽略的不是力量，而是力量经过身体的路径。重心从支撑脚出发，穿过髋、躯干和肩，最后到达球拍。动作越急，越要先确认这条路径没有断开。</p><h2 style="margin-top:56px">把感觉变成问题</h2><p class="intro">每次练习只验证一个问题：击球点提前一点，落点是否更深？支撑更稳一点，手上是否更松？用结果反推动作，才能让“发力感”变成可复现的技术。</p></div></article></main><footer class="site-footer"><a href="../">← 返回首页</a><span>ANT / 2026</span></footer></body></html>
