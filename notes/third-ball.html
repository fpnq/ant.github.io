<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发球、肘部与第三板 · Ant</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="site-header"><a class="brand" href="../">ANT<span>/NOTES</span></a><nav><a href="../#notes">笔记</a><a href="../#about">关于</a></nav></header><main><article class="hero"><p class="eyebrow">03 / 比赛策略</p><h1>发球、肘部<br><em>与第三板</em></h1><p class="intro">先让对手难受，再让自己舒服。发球的变化不是展示种类，而是把回球送进一个我已经准备好的区域。</p><div class="section-block" style="padding-top:64px"><h2>第一板先打质量</h2><p class="intro">抢拉肘部的目的不是一板打死，而是让对手在正手和反手之间犹豫，降低第一板进攻质量。深、转、带一点向前性，比极限力量更重要。</p><h2 style="margin-top:56px">第二板再找空当</h2><p class="intro">对方被迫侧身，就变正手空当；对方用反手处理，就继续压住或突然变线。第一板制造选择题，第二板利用他的答案。</p></div></article></main><footer class="site-footer"><a href="../">← 返回首页</a><span>ANT / 2026</span></footer></body></html>
