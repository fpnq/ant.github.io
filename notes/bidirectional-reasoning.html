<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双向推理与模型训练 · Ant</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="site-header"><a class="brand" href="../">ANT<span>/NOTES</span></a><nav><a href="../#notes">笔记</a><a href="../#about">关于</a></nav></header><main><article class="hero"><p class="eyebrow">02 / 训练思维</p><h1>双向推理与<br><em>模型训练</em></h1><p class="intro">从结果反推动作，从动作预测结果。训练不是堆数量，而是不断缩小“我以为”和“实际发生”之间的距离。</p><div class="section-block" style="padding-top:64px"><h2>两条路同时走</h2><p class="intro">正向推理问：如果我改变重心、拍面和击球点，球会怎样？反向推理问：这个落点和弧线，说明刚才哪一个环节出了偏差？两者结合，练习才有反馈闭环。</p><h2 style="margin-top:56px">保留可验证的结论</h2><p class="intro">好的训练笔记不需要写得绝对。记录当时的假设、球的结果和下一次要改的一个变量，留出空间让身体用下一组球修正答案。</p></div></article></main><footer class="site-footer"><a href="../">← 返回首页</a><span>ANT / 2026</span></footer></body></html>
